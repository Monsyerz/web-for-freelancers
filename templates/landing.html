{% extends "base.html" %}

{% block title %}Web for Freelancers{% endblock %}

{% block content %}
<div class="landing-container">
    <div class="landing-panel teacher-panel">
        <div class="panel-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        </div>
        <h2>Teacher</h2>
        <p>Manage your lessons, students, and schedule in one place.</p>
        <a href="/accounts/teacher/login/" class="btn">Login as Teacher</a>
    </div>
    <div class="landing-panel student-panel">
        <div class="panel-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"></path>
            </svg>
        </div>
        <h2>Student</h2>
        <p>Access your lessons, homework, and learning materials.</p>
        <a href="/accounts/student/login/" class="btn">Login as Student</a>
    </div>
</div>
{% endblock %}

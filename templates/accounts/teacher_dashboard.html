{% extends "base.html" %}

{% block title %}Teacher Dashboard{% endblock %}

{% block content %}
<div class="dashboard-layout">
    <aside class="dashboard-sidebar">
        <nav class="sidebar-nav">
            <a href="{% url 'teacher_dashboard' %}" class="sidebar-link active">Dashboard</a>
            <a href="#" class="sidebar-link">Lessons</a>
            <a href="#" class="sidebar-link">Students</a>
            <a href="#" class="sidebar-link">Homework</a>
            <a href="#" class="sidebar-link">Notes</a>
        </nav>
    </aside>

    <div class="dashboard-main">
        <div class="dashboard-welcome">
            <h1>Welcome, {{ profile.display_name|default:user.username }}!</h1>
            <p>This is your teacher dashboard.</p>
        </div>

        <div class="dashboard-section">
            <h2>Upcoming Lessons</h2>
            <div class="lessons-placeholder">
                <p>No upcoming lessons scheduled.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Logowanie ucznia{% endblock %}

{% block content %}
<div class="login-container">
    <h1>Logowanie ucznia</h1>

    {% if form.errors %}
    <div class="alert alert-error" role="alert">
        Nieprawidłowe dane logowania.
    </div>
    {% endif %}

    <form method="post" action="{% url 'student_login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_username">Nazwa użytkownika</label>
            <input type="text" name="username" id="id_username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
            <label for="id_password">Hasło</label>
            <input type="password" name="password" id="id_password" required autocomplete="current-password">
        </div>

        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">

        <button type="submit" class="btn btn-primary">Zaloguj się</button>
    </form>

    <p class="mt-3">
        <a href="{% url 'landing' %}">Wróć do strony głównej</a>
    </p>
</div>
{% endblock %}
